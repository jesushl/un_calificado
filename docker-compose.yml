services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uncalificado}
      POSTGRES_USER: ${POSTGRES_USER:-uncalificado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uncalificado_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uncalificado} -d ${POSTGRES_DB:-uncalificado}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # Código montado desde el host: edita y guarda; Gunicorn recarga solo.
    # Rebuild solo si cambian Dockerfile o requirements.txt.
    command:
      [
        "gunicorn",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "1",
        "--reload",
        "app.main:app",
      ]
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uncalificado}:${POSTGRES_PASSWORD:-uncalificado_dev_password}@db:5432/${POSTGRES_DB:-uncalificado}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env antes de iniciar la API}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-30}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-100}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      OBJECT_STORE_PATH: /data/objects
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://127.0.0.1:8000}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
      OAUTH_TIKTOK_CLIENT_KEY: ${OAUTH_TIKTOK_CLIENT_KEY:-}
      OAUTH_TIKTOK_CLIENT_SECRET: ${OAUTH_TIKTOK_CLIENT_SECRET:-}
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
      - ./contracts:/app/contracts
      - object_store:/data/objects
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    # Código montado desde el host: Vite recarga al guardar.
    # Rebuild solo si cambian web/Dockerfile o package*.json.
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  seed:
    build: .
    profiles: ["seed"]
    command: ["python", "-m", "app.seed"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-uncalificado}:${POSTGRES_PASSWORD:-uncalificado_dev_password}@db:5432/${POSTGRES_DB:-uncalificado}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env antes de cargar datos}
      OBJECT_STORE_PATH: /data/objects
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
      - object_store:/data/objects
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  object_store:
  web_node_modules:
